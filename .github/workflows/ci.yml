name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si se sube otro commit a la misma rama o PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2

      - uses: actions/setup-java@v6
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Compilar y testear
        run: ./mvnw -B verify
        timeout-minutes: 10

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2

      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        timeout-minutes: 4

      - name: Lint
        run: npm run lint
        timeout-minutes: 2

      - name: Build
        run: npm run build
        timeout-minutes: 3
