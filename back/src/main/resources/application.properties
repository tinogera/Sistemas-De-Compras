spring.application.name=Solicitude-Compra

# Carga las variables de back/.env (ruta relativa al directorio desde donde se ejecuta la app)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

spring.jpa.hibernate.ddl-auto=validate

spring.data.web.pageable.max-page-size=100

# Swagger apagado por defecto; el perfil dev lo prende (application-dev.properties)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Usuarios de prueba (solo con DATOS_PRUEBA=true en el .env; ver DatosDePrueba)
app.datos-prueba=${DATOS_PRUEBA:false}
app.datos-prueba-password=${DATOS_PRUEBA_PASSWORD:}


spring.modulith.events.republish-outstanding-events-on-restart=true

spring.modulith.events.completion-mode=delete

app.eventos.reintento.habilitado=true
app.eventos.reintento.cada=PT1M
app.eventos.reintento.antiguedad=PT2M

# Adjuntos (T14): carpeta en disco y límites de subida
app.adjuntos.dir=${ADJUNTOS_DIR:./adjuntos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Adjuntos (T14): carpeta en disco y limites de subida
app.adjuntos.dir=${ADJUNTOS_DIR:./adjuntos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
