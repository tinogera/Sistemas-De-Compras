spring.application.name=Solicitude-Compra

# Carga las variables de back/.env (ruta relativa al directorio desde donde se ejecuta la app)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.data.web.pageable.max-page-size=100
