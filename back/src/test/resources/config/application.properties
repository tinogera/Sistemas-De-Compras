# Solo para los tests. Spring Boot lee classpath:/config/ además de classpath:/application.properties
# (no lo reemplaza), así que esto se suma a la configuración de src/main/resources.
#
# En producción los eventos procesados se borran (completion-mode=delete). Muchos tests esperan a que un
# evento quede "completado" con CompletedEventPublications, que con delete siempre está vacío: acá se
# deja en update. ReintentoDeEventosTest vuelve a poner delete para probar la configuración real.
spring.modulith.events.completion-mode=update
